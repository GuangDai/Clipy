# Clipy — SwiftLint gate configuration (docs/01-architecture.md Part I §8 / §9).
#
# SwiftLint runs on the macOS CI runner alongside the Xcode build. The portable
# equivalent of these rules — enforced on any platform — lives in
# scripts/import_gate.py and scripts/escape_hatch_scan.py (driven by
# scripts/run_gates.sh). Keep the rule table below in sync with those scripts.
#
# At roadmap step 0 only the confinement / escape-hatch custom rules run.
#
# Matching notes:
#   - `included`/`excluded` are regexes matched against each file's path.
#   - Import regexes tolerate import attributes (`@_exported`,
#     `@preconcurrency`), access-level imports, and kind imports
#     (`import struct Foo.Bar`); the module name is what is checked.

only_rules:
  - custom_rules

excluded:
  - .build

custom_rules:

  # ---- Import confinement (mirror of scripts/import_gate.py) ----

  clipboardformats_import_confinement:
    name: "ClipboardFormats import confinement"
    included: "Sources/ClipboardFormats/"
    # Allowlist: immutable stable facts remain Foundation-only.
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?!(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?Foundation)\w'
    message: "ClipboardFormats may import Foundation (and its submodules) only (Part I §8)."
    severity: error

  clipycli_contract_import_confinement:
    name: "ClipyCLIContract import confinement"
    included: "Sources/ClipyCLIContract/"
    # Allowlist: the pure wire contract has no product or transport dependency.
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?!(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?Foundation)\w'
    message: "ClipyCLIContract may import Foundation (and its submodules) only (Part I §8)."
    severity: error

  historycore_import_confinement:
    name: "HistoryCore import confinement"
    included: "Sources/HistoryCore/"
    # Allowlist: Foundation and its submodules (prefix match) only.
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?!(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?Foundation)\w'
    message: "HistoryCore may import Foundation (and its submodules) only (Part I §8)."
    severity: error

  historydomain_import_confinement:
    name: "HistoryDomain import confinement"
    included: "Sources/HistoryDomain/"
    # Allowlist: Foundation (+ submodules) and HistoryCore only.
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?!(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?(?:Foundation|HistoryCore)\b)\w'
    message: "HistoryDomain may import Foundation and HistoryCore only (Part I §8)."
    severity: error

  historyperfrunner_import_confinement:
    name: "HistoryPerfRunner import confinement"
    included: "Sources/HistoryPerfRunner/"
    # Allowlist: Foundation (+ submodules), HistoryCore, and HistoryStorage.
    # HistoryStorage added at step 8: the §9 runner drives the public
    # SwiftDataHistory concrete facade (docs/06-cross-cutting.md §9).
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?!(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?(?:Foundation|HistoryCore|HistoryStorage)\b)\w'
    message: "HistoryPerfRunner may import Foundation, HistoryCore, and HistoryStorage only (Part I §8)."
    severity: error

  historyrestartprobe_import_confinement:
    name: "HistoryRestartProbe import confinement"
    included: "Sources/HistoryRestartProbe/"
    # Allowlist: the restart tracer is a public-API-only composition client.
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?!(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?(?:Foundation|HistoryCore|HistoryStorage)\b)\w'
    message: "HistoryRestartProbe may import Foundation, HistoryCore, and HistoryStorage only (Part I §8)."
    severity: error

  clipy_uds_f0_shared_import_confinement:
    name: "Clipy UDS F0 shared import confinement"
    included: "ClipyApp/Tools/ClipyUDSF0Shared/"
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?!(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?(?:Foundation|Darwin)\b)\w'
    message: "ClipyUDSF0Shared may import Foundation and Darwin only (Part I §8)."
    severity: error

  clipy_uds_f0_client_import_confinement:
    name: "Clipy UDS F0 client import confinement"
    included: "ClipyApp/Tools/ClipyUDSF0Client/"
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?!(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?(?:Foundation|AppKit|Darwin)\b)\w'
    message: "ClipyUDSF0Client may import Foundation, AppKit, and Darwin only (Part I §8)."
    severity: error

  historystorage_import_confinement:
    name: "HistoryStorage import confinement"
    included: "Sources/HistoryStorage/"
    # Blocklist target: SwiftData / ImageIO / xxh3 / Fuse / HistoryCore /
    # HistoryDomain are allowed (Fuse pinned at roadmap step 3).
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?(?:AppKit|SwiftUI|PasteboardAdapter|PresentationUI)\b'
    message: "HistoryStorage must not import AppKit, SwiftUI, adapters, or PresentationUI (Part I §8)."
    severity: error

  pasteboardadapter_import_confinement:
    name: "PasteboardAdapter import confinement"
    included: "Sources/PasteboardAdapter/"
    # Blocklist target: AppKit is allowed; other adapters would be added here
    # if a second adapter target ever appears (no adapter imports another).
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?(?:HistoryDomain|HistoryStorage|SwiftUI|SwiftData)\b'
    message: "PasteboardAdapter must not import HistoryDomain, HistoryStorage, SwiftUI, or SwiftData (Part I §8)."
    severity: error

  presentationui_import_confinement:
    name: "PresentationUI import confinement"
    included: "Sources/PresentationUI/"
    # Blocklist target: SwiftUI is allowed.
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?(?:HistoryDomain|HistoryStorage|AppKit|SwiftData)\b'
    message: "PresentationUI must not import HistoryDomain, HistoryStorage, AppKit, or SwiftData (Part I §8)."
    severity: error

  xxh3_confinement:
    name: "xxh3 confinement"
    included: "Sources/"
    excluded: "Sources/HistoryStorage/"
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?xxh3\b'
    message: "xxh3 is confined to HistoryStorage (Part I §8)."
    severity: error

  fuse_confinement:
    name: "Fuse confinement"
    included: "Sources/"
    excluded: "Sources/HistoryStorage/"
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?Fuse\b'
    message: "Fuse is confined to HistoryStorage (Part I §8)."
    severity: error

  appintents_confinement:
    name: "AppIntents confinement"
    included: "(Sources|Tests|ClipyApp)/"
    excluded: "(ClipyApp/Sources|ClipyApp/Tests/ClipyIntegrationTests)/"
    regex: '^\s*(?:@[A-Za-z_][A-Za-z0-9_]*(?:\([^\n)]*\))?\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|func|typealias|var|let)\s+)?AppIntents\b'
    message: "AppIntents is confined to ClipyApp and its hosted integration tests (Part I §8)."
    severity: error

  # ---- Escape hatches and service locators (mirror of scripts/escape_hatch_scan.py) ----

  no_unchecked_sendable:
    name: "No @unchecked Sendable"
    included: "(Sources|Tests|ClipyApp/Sources|ClipyApp/Tests|ClipyApp/Tools)/"
    regex: '@unchecked\s+Sendable'
    message: "@unchecked Sendable is banned in the greenfield targets (Part I §8)."
    severity: error

  no_nonisolated_unsafe:
    name: "No nonisolated(unsafe)"
    included: "(Sources|Tests|ClipyApp/Sources|ClipyApp/Tests|ClipyApp/Tools)/"
    regex: 'nonisolated\s*\(\s*unsafe\s*\)'
    message: "nonisolated(unsafe) is banned in the greenfield targets (Part I §8)."
    severity: error

  no_service_locator:
    name: "No service locator"
    included: "(Sources|Tests|ClipyApp/Sources|ClipyApp/Tests|ClipyApp/Tools)/"
    regex: '\bstatic\s+(?:let|var)\s+(?:shared|current)\b'
    message: "Service-locator spelling 'static let/var shared|current' is banned (Part I §8); inject dependencies instead."
    severity: error

  appdependency_shared_confinement:
    name: "AppDependencyManager.shared confinement"
    included: "(Sources|Tests|ClipyApp)/"
    excluded: "ClipyApp/Sources/AppIntents/AppIntentDependencyRegistration.swift"
    regex: '\bAppDependencyManager\s*\.\s*shared\b'
    message: "AppDependencyManager.shared is confined to the one composition-root add(dependency:) registration (Part I §8)."
    severity: error
