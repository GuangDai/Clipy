name: macOS 26 ARM CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      admission_scope:
        description: "Dispatch-only performance lane; tests-only runs gates + SwiftPM + app tests without any perf lane"
        required: true
        default: full
        type: choice
        options:
          - full
          - exact-matcher-ab
          - tests-only

concurrency:
  group: macos26-arm-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: Lint + source gates
    runs-on: macos-26
    timeout-minutes: 15
    env:
      NSUnbufferedIO: YES
      OS_ACTIVITY_MODE: disable
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare log directories
        shell: bash
        run: mkdir -p "$LOG_DIR"

      - name: Print runner and toolchain diagnostics
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "== Date =="
            date -u
            echo
            echo "== Runner =="
            echo "RUNNER_OS=${RUNNER_OS:-}"
            echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
            echo "ImageOS=${ImageOS:-}"
            echo "ImageVersion=${ImageVersion:-}"
            echo
            echo "== macOS =="
            sw_vers
            echo
            echo "== Kernel and CPU =="
            uname -a
            uname -m
            echo
            echo "== Xcode =="
            xcode-select -p
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            echo
            echo "== Swift =="
            swift --version
          } 2>&1 | tee "$LOG_DIR/diagnostics.log"

      - name: Enforce macOS 26 ARM runner
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_VERSION="$(sw_vers -productVersion)"
          MACHINE_ARCH="$(uname -m)"
          echo "Detected macOS version: $PRODUCT_VERSION"
          echo "Detected architecture: $MACHINE_ARCH"
          if [[ "$PRODUCT_VERSION" != 26.* ]]; then
            echo "Expected macOS 26.x, got $PRODUCT_VERSION"
            exit 1
          fi
          if [[ "$MACHINE_ARCH" != arm64 ]]; then
            echo "Expected arm64 runner, got $MACHINE_ARCH"
            exit 1
          fi

      - name: Run source gates (imports, safety, vendor integrity/symbols, API snapshot)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run_gates.sh 2>&1 | tee "$LOG_DIR/source-gates.log"

      - name: Run SwiftLint
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version
          swiftlint lint --quiet --strict --no-cache 2>&1 | tee "$LOG_DIR/swiftlint.log"

      - name: Self-scan swiftlint log
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -Ein '(^|[^[:alpha:]])(warning:|error:)([^[:alpha:]]|$)' "$LOG_DIR/swiftlint.log" || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "SwiftLint warnings/errors found"
            exit 1
          fi

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: warn
          retention-days: 14

  spm-build-test:
    name: SwiftPM build + test
    needs: [gates]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NSUnbufferedIO: YES
      OS_ACTIVITY_MODE: disable
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare log directories
        shell: bash
        run: mkdir -p "$LOG_DIR"

      - name: Enforce macOS 26 ARM runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          [[ "$(uname -m)" == arm64 ]]

      - name: Fetch test fixtures
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_ROOT="$RUNNER_TEMP/clipy-fixtures"
          mkdir -p "$FIXTURE_ROOT"
          bash scripts/fetch_fixtures.sh "$FIXTURE_ROOT"
          echo "CLIPY_FIXTURES_DIR=$FIXTURE_ROOT/clipy-fixtures-v1" >> "$GITHUB_ENV"

      - name: Build package graph (Swift 6 strict concurrency)
        shell: bash
        run: |
          set -o pipefail
          swift build 2>&1 | tee "$LOG_DIR/spm-build.log"

      - name: Run package tests
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$LOG_DIR/spm-test.log"

      - name: Self-scan SPM logs
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -Ein '(^|[^[:alpha:]])(warning:|error:)([^[:alpha:]]|$)' \
            "$LOG_DIR/spm-build.log" "$LOG_DIR/spm-test.log" || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "Warnings or errors found in SPM logs"
            exit 1
          fi

      - name: Upload SPM logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: warn
          retention-days: 14

  xcodeproj:
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.admission_scope == 'full'
      || inputs.admission_scope == 'tests-only'
    name: XcodeGen generate + app build/test
    needs: [gates]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NSUnbufferedIO: YES
      OS_ACTIVITY_MODE: disable
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
      PROJECT: ClipyApp/ClipyApp.xcodeproj
      SCHEME: ClipyApp
      CONFIGURATION: Debug
      DESTINATION: platform=macOS,arch=arm64
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      RESULT_BUNDLES: ${{ github.workspace }}/ci-result-bundles
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare log and result directories
        shell: bash
        run: mkdir -p "$LOG_DIR" "$RESULT_BUNDLES"

      - name: Enforce macOS 26 ARM runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          [[ "$(uname -m)" == arm64 ]]

      - name: Generate twice and verify repeatability
        shell: bash
        env:
          XCODEGEN_HOME: ${{ runner.temp }}/xcodegen-2.45.4
        run: |
          set -euo pipefail
          bash scripts/generate-xcodeproj.sh 2>&1 | tee "$LOG_DIR/xcodegen-first.log"
          cp -R "$PROJECT" "$RUNNER_TEMP/first-generated.xcodeproj"
          bash scripts/generate-xcodeproj.sh 2>&1 | tee "$LOG_DIR/xcodegen-second.log"
          diff -ru "$RUNNER_TEMP/first-generated.xcodeproj" "$PROJECT" \
            | tee "$LOG_DIR/xcodegen-repeatability.diff"

      - name: Fetch test fixtures
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_ROOT="$RUNNER_TEMP/clipy-fixtures"
          mkdir -p "$FIXTURE_ROOT"
          bash scripts/fetch_fixtures.sh "$FIXTURE_ROOT"
          echo "CLIPY_FIXTURES_DIR=$FIXTURE_ROOT/clipy-fixtures-v1" >> "$GITHUB_ENV"

      - name: List generated project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -json -project "$PROJECT" > "$LOG_DIR/project-list.json"

      - name: Build and test generated app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLES/app.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            clean build test 2>&1 | tee "$LOG_DIR/app-build-test.log"

      - name: Self-scan app build/test log
        shell: bash
        run: |
          set -euo pipefail
          # Tolerate headless-runner toolchain noise: the AppIntents metadata
          # processor warns on every bundle without an AppIntents dependency —
          # not a code warning (same class as Maccy's Metal/XPC exclusions).
          # Also excluded: any line naming the Apple-internal LaunchServices
          # service "com.apple.linkd.autoShortcut" (NSCocoaErrorDomain 4097) —
          # intermittent headless-runner noise whose long log lines may wrap,
          # so the match must not anchor on a line prefix.
          matches=$(grep -Ein '(^|[^[:alpha:]])(warning:|error:|\*\* TEST FAILED \*\*|\*\* BUILD FAILED \*\*)([^[:alpha:]]|$)' "$LOG_DIR/app-build-test.log" \
                    | grep -vE 'appintentsmetadataprocessor.*Metadata extraction skipped' \
                    | grep -vE 'com\.apple\.linkd\.autoShortcut' || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "Warnings, errors, or failures found in app build/test log"
            exit 1
          fi

      - name: Upload xcodeproj evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodeproj-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs
            ci-result-bundles
          if-no-files-found: warn
          retention-days: 14

  perf-proofs:
    # Part VI §9 performance proofs (docs/06-cross-cutting.md §9). Standalone
    # (needs only gates): the release build compiles the full dependency graph,
    # so a compile failure in any target fails this job independently. Running
    # in parallel with spm-build-test and xcodeproj saves wall-clock time.
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.admission_scope == 'full'
    name: Perf proofs (§9)
    needs: [gates]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NSUnbufferedIO: YES
      OS_ACTIVITY_MODE: disable
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare log directories
        shell: bash
        run: mkdir -p "$LOG_DIR"

      - name: Enforce macOS 26 ARM runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          [[ "$(uname -m)" == arm64 ]]

      - name: Build HistoryPerfRunner (release)
        shell: bash
        run: |
          set -o pipefail
          swift build -c release --product HistoryPerfRunner 2>&1 | tee "$LOG_DIR/perf-build.log"

      - name: Self-scan perf build log
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -Ein '(^|[^[:alpha:]])(warning:|error:)([^[:alpha:]]|$)' \
            "$LOG_DIR/perf-build.log" || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "Warnings or errors found in perf build log"
            exit 1
          fi

      - name: Run HistoryPerfRunner (§9 proofs)
        shell: bash
        run: |
          set -o pipefail
          swift run -c release HistoryPerfRunner "$LOG_DIR/perf-fixtures.json" 2>&1 | tee "$LOG_DIR/perf-run.log"

      - name: Self-scan perf run log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -Ein '(^|[^[:alpha:]])(warning:|error:)([^[:alpha:]]|$)' \
            "$LOG_DIR/perf-run.log" || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "Warnings or errors found in perf run log"
            exit 1
          fi

      - name: Upload perf fixtures and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/perf-*.json
            ci-logs/perf-*.log
          if-no-files-found: warn
          retention-days: 14

  exact-matcher-ab:
    # A short Release A/B for IND-07. This deliberately skips persistent-store
    # preparation and the 101-call admission lane so matcher experiments can be
    # accepted or rejected before paying the full-corpus measurement cost.
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.admission_scope == 'exact-matcher-ab'
    name: Exact matcher Release A/B
    needs: [gates, spm-build-test]
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NSUnbufferedIO: YES
      OS_ACTIVITY_MODE: disable
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      LOG_DIR: ${{ github.workspace }}/matcher-ab-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p "$LOG_DIR"

      - name: Enforce supported runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          [[ "$(uname -m)" == arm64 ]]

      - name: Build Release matcher runner
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/clipy-matcher-ab-build"
          swift build -c release --scratch-path "$scratch" \
            --product HistoryPerfRunner \
            2>&1 | tee "$LOG_DIR/build.log"
          swift build -c release --scratch-path "$scratch" \
            --show-bin-path \
            2>&1 | tee "$LOG_DIR/bin-path.log"
          runner="$(tail -n 1 "$LOG_DIR/bin-path.log")/HistoryPerfRunner"
          [[ -x "$runner" ]]
          echo "MATCHER_AB_BIN=$runner" >> "$GITHUB_ENV"

      - name: Run exact matcher A/B
        # 13 cases x (2 warmups + 11 samples) x 2 sides x 32 MiB; the
        # Foundation oracle alone needs several seconds per absent-case
        # operation, so the full screen runs ~10-15 minutes.
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          "$MATCHER_AB_BIN" --admission exact-matcher-ab \
            "$RUNNER_TEMP/unused-store.sqlite" \
            "$LOG_DIR/exact-matcher-ab.json" \
            2>&1 | tee "$LOG_DIR/exact-matcher-ab.log"

      - name: Validate record-only A/B fixture
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == 2
            and .mode == "exact-matcher-ab"
            and .evidenceClass == "release-matcher-ab-record-only"
            and .bodiesPerSample == 128
            and .bodyBytes == 262144
            and .warmupCount == 2
            and .sampleCount == 11
            and .constructionsPerSample == 256
            and (.scopeLimitations | length) == 3
            and (.cases | length) == 13
            and ([.cases[].name] | sort) == [
              "absent-needle-1",
              "absent-needle-64",
              "admission-absent-48",
              "early-hit-16",
              "high-entropy-absent-10",
              "late-cr-fallback",
              "late-hit-16",
              "late-unicode-fallback",
              "middle-hit-16",
              "repeated-prefix-4096",
              "source-absent-16",
              "source-common-hit-4",
              "unicode-needle-fallback"
            ]
            and ([.cases[].name] | unique | length) == 13
            and all(.cases[];
              (.foundationRawSamplesMs | length) == 11
              and (.compiledRawSamplesMs | length) == 11
              and (.pairedRawRatios | length) == 11
              and (.compiledConstructionRawSamplesMs | length) == 11
              and all(.foundationRawSamplesMs[]; . > 0)
              and all(.compiledRawSamplesMs[]; . > 0)
              and all(.pairedRawRatios[]; . > 0)
              and all(.compiledConstructionRawSamplesMs[]; . > 0)
              and .foundationMedianMs > 0
              and .compiledMedianMs > 0
              and .compiledToFoundationRatio > 0
              and .pairedMedianRatio > 0
              and .pairedP25Ratio > 0
              and .pairedP75Ratio > 0
              and .pairedP25Ratio <= .pairedMedianRatio
              and .pairedMedianRatio <= .pairedP75Ratio
              and .compiledConstructionMedianMs > 0
              and .maximumPairedMedianRatio > 0
              and (.passesDecisionThreshold
                == (.pairedMedianRatio <= .maximumPairedMedianRatio))
              and (((.compiledToFoundationRatio
                - (.compiledMedianMs / .foundationMedianMs)) | fabs)
                < 0.000000001)
              and .logicalBytesPerSample == (.bodiesPerSample * 262144)
              and .bodiesPerSample >= 2
              and .bodiesPerSample <= 128)
            and (.productionIntegrationEligible
              == all(.cases[]; .passesDecisionThreshold))
          ' "$LOG_DIR/exact-matcher-ab.json" >/dev/null
          matches=$(grep -Ein \
            '(^|[^[:alpha:]])(warning:|error:)([^[:alpha:]]|$)' \
            "$LOG_DIR"/*.log || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "Warnings or errors found in matcher A/B logs"
            exit 1
          fi

      - name: Summarize matcher A/B
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Exact matcher Release A/B"
            echo
            echo "Record-only paired compiled/Foundation ratios; lower is better."
            jq -r \
              '.cases[] | "- \(.name): \(.pairedMedianRatio)x (limit \(.maximumPairedMedianRatio), pass=\(.passesDecisionThreshold))"' \
              "$LOG_DIR/exact-matcher-ab.json"
            echo
            jq -r '"Production-integration screening result: \(.productionIntegrationEligible)"' \
              "$LOG_DIR/exact-matcher-ab.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload matcher A/B evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exact-matcher-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: matcher-ab-logs/*
          if-no-files-found: error
          retention-days: 30

  performance-admission:
    # Dispatch-only evidence for measurement-gated deferred work. Keeping this
    # job in the established workflow lets a feature branch run its own version
    # before merge; a new standalone workflow is not dispatchable until its
    # workflow file exists on the default branch.
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.admission_scope == 'full'
    name: 5,000-row p50/p95/p99 + RSS evidence
    needs: [gates, spm-build-test]
    runs-on: macos-26
    timeout-minutes: 300
    env:
      NSUnbufferedIO: YES
      OS_ACTIVITY_MODE: disable
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      LOG_DIR: ${{ github.workspace }}/admission-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          store_url="$RUNNER_TEMP/clipy-performance-admission/store.sqlite"
          smoke_store_url="$RUNNER_TEMP/clipy-performance-admission-smoke/store.sqlite"
          mkdir -p "$LOG_DIR" "$(dirname "$store_url")" "$(dirname "$smoke_store_url")"
          echo "STORE_URL=$store_url" >> "$GITHUB_ENV"
          echo "SMOKE_STORE_URL=$smoke_store_url" >> "$GITHUB_ENV"

      - name: Enforce supported runner and record diagnostics
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          [[ "$(uname -m)" == arm64 ]]
          {
            date -u
            sw_vers
            uname -m
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            swift --version
            sysctl -n hw.model
            sysctl -n machdep.cpu.brand_string
            sysctl -n hw.memsize
          } 2>&1 | tee "$LOG_DIR/diagnostics.log"

      - name: Build isolated Release and Debug admission runners
        shell: bash
        run: |
          set -euo pipefail
          release_scratch="$RUNNER_TEMP/clipy-admission-release-build"
          debug_scratch="$RUNNER_TEMP/clipy-admission-debug-build"
          swift build -c release --scratch-path "$release_scratch" \
            --product HistoryPerfRunner \
            2>&1 | tee "$LOG_DIR/build.log"
          swift build -c release --scratch-path "$release_scratch" \
            --show-bin-path \
            2>&1 | tee "$LOG_DIR/bin-path.log"
          ADMISSION_BIN="$(tail -n 1 "$LOG_DIR/bin-path.log")/HistoryPerfRunner"
          [[ -x "$ADMISSION_BIN" ]]
          [[ "$ADMISSION_BIN" == */release/HistoryPerfRunner ]]
          swift build -c debug --scratch-path "$debug_scratch" \
            --product HistoryPerfRunner \
            2>&1 | tee "$LOG_DIR/debug-build.log"
          swift build -c debug --scratch-path "$debug_scratch" \
            --show-bin-path \
            2>&1 | tee "$LOG_DIR/debug-bin-path.log"
          ADMISSION_DEBUG_BIN="$(tail -n 1 "$LOG_DIR/debug-bin-path.log")/HistoryPerfRunner"
          [[ -x "$ADMISSION_DEBUG_BIN" ]]
          [[ "$ADMISSION_DEBUG_BIN" == */debug/HistoryPerfRunner ]]
          [[ "$ADMISSION_DEBUG_BIN" != "$ADMISSION_BIN" ]]
          echo "ADMISSION_BIN=$ADMISSION_BIN" >> "$GITHUB_ENV"
          echo "ADMISSION_DEBUG_BIN=$ADMISSION_DEBUG_BIN" >> "$GITHUB_ENV"

      - name: Self-scan build diagnostics
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -Ein '(^|[^[:alpha:]])(warning:|error:)([^[:alpha:]]|$)' \
            "$LOG_DIR/build.log" "$LOG_DIR/bin-path.log" \
            "$LOG_DIR/debug-build.log" "$LOG_DIR/debug-bin-path.log" || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "Warnings or errors found in admission build log"
            exit 1
          fi

      - name: Prepare 1,000 × 256 KiB persistent smoke corpus
        id: prepare_smoke
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -l -o "$LOG_DIR/seed-smoke.time" \
            "$ADMISSION_BIN" --admission seed-smoke \
            "$SMOKE_STORE_URL" "$LOG_DIR/prepare-smoke.json" \
            2>&1 | tee "$LOG_DIR/seed-smoke.log"
          /usr/bin/time -l -o "$LOG_DIR/prepare-smoke.time" \
            "$ADMISSION_BIN" --admission prepare-smoke \
            "$SMOKE_STORE_URL" "$LOG_DIR/prepare-smoke.json" \
            2>&1 | tee "$LOG_DIR/prepare-smoke.log"

      - name: Require clean bounded prepare smoke
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.prepare_smoke.outcome }}" != success ]]; then
            echo "Prepare smoke processes did not complete"
            exit 1
          fi
          # Known-benign CoreData external-storage race (runs 31808691118,
          # 31809994808): a later transaction in the same process attempts to
          # clone an earlier batch's external record from its already-consumed
          # `.interim` staging name, logs the failure, and CoreData's copy
          # fallback completes the save — every phase exited 0 and the JSON
          # assertions below (row counts, positions, transactions) remain the
          # data-integrity gate. Strip those multi-line error blocks (opening
          # `CoreData: error: Failed to clone…` through the terminating `}}`)
          # before the strict scan; every other warning/error line — including
          # any other "No such file or directory" — stays fatal.
          matches=$(
            for log in "$LOG_DIR/seed-smoke.log" "$LOG_DIR/prepare-smoke.log"; do
              awk '
                /^CoreData: error: Failed to clone external data reference/ { block = 1 }
                block && /\}\}$/ { block = 0; next }
                block { next }
                { print }
              ' "$log"
            done | grep -Ein \
              'No such file or directory|(^|[^[:alpha:]])(warning:|error:)([^[:alpha:]]|$)' || true
          )
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "Warnings, errors, or missing external data found in prepare smoke"
            exit 1
          fi
          jq -e '
            .mode == "prepare-smoke"
            and .corpusRows == 1000
            and .bodyBytesPerRow == 262144
            and .validation.seededRows == "999"
            and .validation.publicValidationCaptures == "2"
            and .validation.seedBatchSize == "64"
            and .validation.seedTransactions == "16"
            and .validation.seedPosition == "16"
            and .validation.position == "18"
          ' "$LOG_DIR/prepare-smoke.json" >/dev/null

      - name: Prepare one persistent 5,000 × 256 KiB corpus
        id: prepare
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -l -o "$LOG_DIR/seed.time" \
            "$ADMISSION_BIN" --admission seed \
            "$STORE_URL" "$LOG_DIR/prepare.json" \
            2>&1 | tee "$LOG_DIR/seed.log"
          /usr/bin/time -l -o "$LOG_DIR/prepare.time" \
            "$ADMISSION_BIN" --admission prepare \
            "$STORE_URL" "$LOG_DIR/prepare.json" \
            2>&1 | tee "$LOG_DIR/prepare.log"

      - name: Require clean bounded full preparation
        id: prepare_cleanliness
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.prepare.outcome }}" != success ]]; then
            echo "Prepare processes did not complete"
            exit 1
          fi
          # Same recovered CoreData external-storage clone race as the smoke
          # scan above: strip only those multi-line error blocks; the jq
          # assertions in this step stay the data-integrity gate and every
          # other warning/error (or missing-file) line remains fatal.
          matches=$(
            for log in "$LOG_DIR/seed.log" "$LOG_DIR/prepare.log"; do
              awk '
                /^CoreData: error: Failed to clone external data reference/ { block = 1 }
                block && /\}\}$/ { block = 0; next }
                block { next }
                { print }
              ' "$log"
            done | grep -Ein \
              'No such file or directory|(^|[^[:alpha:]])(warning:|error:)([^[:alpha:]]|$)' || true
          )
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "Warnings, errors, or missing external data found in full preparation"
            exit 1
          fi
          jq -e '
            .mode == "prepare"
            and .corpusRows == 5000
            and .bodyBytesPerRow == 262144
            and .validation.seededRows == "4999"
            and .validation.publicValidationCaptures == "2"
            and .validation.seedBatchSize == "64"
            and .validation.seedTransactions == "79"
            and .validation.seedPosition == "79"
            and .validation.position == "81"
          ' "$LOG_DIR/prepare.json" >/dev/null

      - name: Measure tie-heavy browse-page latency
        id: browse_ties
        if: always() && steps.prepare_cleanliness.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -l -o "$LOG_DIR/browse-ties.time" \
            "$ADMISSION_BIN" --admission browse-ties \
            "$STORE_URL" "$LOG_DIR/browse-ties.json" \
            2>&1 | tee "$LOG_DIR/browse-ties.log"

      - name: Run one Debug exact-search diagnostic probe
        id: exact_search_probe
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          CLIPY_SEARCH_TRACE=1 CLIPY_STORAGE_TRACE=1 \
            /usr/bin/time -l -o "$LOG_DIR/exact-search-probe.time" \
            "$ADMISSION_DEBUG_BIN" --admission exact-search-probe \
            "$STORE_URL" "$LOG_DIR/exact-search-probe.json" \
            2>&1 | tee "$LOG_DIR/exact-search-probe.log"

      - name: Require complete Debug exact-search diagnostics
        id: exact_search_probe_gate
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.exact_search_probe.outcome }}" != success ]]; then
            echo "exact-search-probe admission mode did not complete: ${{ steps.exact_search_probe.outcome }}"
            exit 1
          fi
          jq -e '
            .schemaVersion == 1
            and .mode == "exact-search-probe"
            and .evidenceClass == "debug-diagnostic"
            and .buildConfiguration == "debug"
            and .traceEnvironmentEnabled == true
            and .canonicalPercentileEvidence == false
            and .publicRequestCount == 1
            and .corpusRows == 5000
            and .bodyBytesPerRow == 262144
            and .elapsedMs > 0
            and .position > 0
            and .matchedRows == 0
            and .hasNextPage == false
            and .completionMarker == "single-public-exact-search-completed"
            and (has("rawSamplesMs") | not)
            and (has("percentiles") | not)
          ' "$LOG_DIR/exact-search-probe.json" >/dev/null
          for marker in \
            '"event":"clipy.storage.lifecycle".*"phase":"startup.fetch.begin"' \
            '"event":"clipy.storage.lifecycle".*"phase":"startup.fetch.complete"' \
            '"event":"clipy.search.trace".*"phase":"entry"' \
            '"event":"clipy.search.trace".*"phase":"complete"'
          do
            if ! grep -E "$marker" "$LOG_DIR/exact-search-probe.log" >/dev/null; then
              echo "Missing required Debug trace marker: $marker"
              exit 1
            fi
          done
          if [[ ! -s "$LOG_DIR/exact-search-probe.time" ]]; then
            echo "exact-search-probe RSS timing record is missing or empty"
            exit 1
          fi

      - name: Measure worst-bound exact search
        id: exact_search
        if: >-
          always()
          && steps.prepare_cleanliness.outcome == 'success'
          && steps.exact_search_probe_gate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 90
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -l -o "$LOG_DIR/exact-search.time" \
            "$ADMISSION_BIN" --admission exact-search \
            "$STORE_URL" "$LOG_DIR/exact-search.json" \
            2>&1 | tee "$LOG_DIR/exact-search.log"

      - name: Measure independent-process warm persistent open
        id: warm_open
        if: >-
          always()
          && steps.prepare_cleanliness.outcome == 'success'
          && steps.exact_search_probe_gate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          samples_dir="$LOG_DIR/warm-open-samples"
          mkdir -p "$samples_dir"
          {
            /usr/bin/time -l -o "$samples_dir/warmup.time" \
              "$ADMISSION_BIN" --admission open-once-and-validate \
              "$STORE_URL" "$samples_dir/000-warmup.json"
            for ((index = 1; index <= 101; index++)); do
              printf -v sample '%03d' "$index"
              /usr/bin/time -l -o "$samples_dir/$sample.time" \
                "$ADMISSION_BIN" --admission open-once \
                "$STORE_URL" "$samples_dir/$sample.json"
            done
            "$ADMISSION_BIN" --admission warm-open \
              "$STORE_URL" "$samples_dir" "$LOG_DIR/warm-open.json"
          } 2>&1 | tee "$LOG_DIR/warm-open.log"

      - name: Summarize peak RSS evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Performance admission"
            echo
            echo "Raw latency samples and machine metadata are in the JSON artifacts."
            echo
            for mode in seed-smoke prepare-smoke seed prepare browse-ties exact-search-probe exact-search; do
              time_file="$LOG_DIR/$mode.time"
              if [[ -f "$time_file" ]]; then
                rss=$(awk '/maximum resident set size/ {print $1}' "$time_file")
                echo "- $mode maximum resident set size: ${rss:-unavailable} bytes"
              fi
            done
            warm_time_files=(
              "$LOG_DIR"/warm-open-samples/[0-9][0-9][0-9].time
            )
            rss=""
            if [[ -f "${warm_time_files[0]}" ]]; then
              rss=$(awk '
                /maximum resident set size/ {
                  if ($1 > maximum) maximum = $1
                }
                END {
                  if (maximum > 0) print maximum
                }
              ' "${warm_time_files[@]}")
            fi
            echo "- warm-open maximum child-process resident set size: ${rss:-unavailable} bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Self-scan admission logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Same recovered CoreData external-storage clone race documented at
          # the smoke scan: strip only those multi-line error blocks; every
          # other warning/error line in any admission log stays fatal.
          matches=$(
            for log in "$LOG_DIR"/*.log; do
              awk '
                /^CoreData: error: Failed to clone external data reference/ { block = 1 }
                block && /\}\}$/ { block = 0; next }
                block { next }
                { print }
              ' "$log"
            done | grep -Ein '(^|[^[:alpha:]])(warning:|error:)([^[:alpha:]]|$)' || true
          )
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo "Warnings or errors found in admission logs"
            exit 1
          fi

      - name: Upload admission evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            admission-logs/*.json
            admission-logs/*.log
            admission-logs/*.time
            admission-logs/warm-open-samples/*.json
            admission-logs/warm-open-samples/*.time
          if-no-files-found: warn
          retention-days: 30

      - name: Require every admission mode to complete
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          require_success() {
            local mode="$1"
            local outcome="$2"
            if [[ "$outcome" != success ]]; then
              echo "$mode admission mode did not complete: $outcome"
              exit 1
            fi
          }
          require_success prepare-smoke "${{ steps.prepare_smoke.outcome }}"
          require_success prepare "${{ steps.prepare.outcome }}"
          require_success prepare-cleanliness "${{ steps.prepare_cleanliness.outcome }}"
          require_success exact-search-probe "${{ steps.exact_search_probe.outcome }}"
          require_success exact-search-probe-gate "${{ steps.exact_search_probe_gate.outcome }}"
          require_success browse-ties "${{ steps.browse_ties.outcome }}"
          require_success exact-search "${{ steps.exact_search.outcome }}"
          require_success warm-open "${{ steps.warm_open.outcome }}"

          # 101 samples support every nearest-rank percentile (p50/p95/p99
          # each select below the sample maximum; see AdmissionFixtures).
          jq -e '
            .mode == "browse-ties"
            and (.rawSamplesMs | length) == 101
            and .percentiles.p50Ms > 0
            and .percentiles.p95Ms > 0
            and .percentiles.p99Ms > 0
          ' "$LOG_DIR/browse-ties.json" >/dev/null
          # exact-search carries the reduced IND-07 measurement budget
          # (11 samples; the 101-sample profile budget cannot finish inside
          # the step ceiling). Per-rank support gating: p95 needs n >= 20
          # and p99 needs n >= 100, so at n = 11 both encode as null and
          # only p50 is admissible.
          jq -e '
            .mode == "exact-search"
            and (.rawSamplesMs | length) == 11
            and .percentiles.p50Ms > 0
            and .percentiles.p95Ms == null
            and .percentiles.p99Ms == null
          ' "$LOG_DIR/exact-search.json" >/dev/null
          jq -e '
            .mode == "warm-open"
            and (.rawSamplesMs | length) == 101
            and .percentiles.p50Ms > 0
            and .percentiles.p95Ms > 0
            and .percentiles.p99Ms > 0
          ' "$LOG_DIR/warm-open.json" >/dev/null
          for mode in seed-smoke prepare-smoke seed prepare browse-ties exact-search; do
            if [[ ! -s "$LOG_DIR/$mode.time" ]]; then
              echo "$mode RSS timing record is missing or empty"
              exit 1
            fi
          done
          if [[ ! -s "$LOG_DIR/warm-open-samples/warmup.time" ]]; then
            echo "warm-open validation RSS timing record is missing or empty"
            exit 1
          fi
          shopt -s nullglob
          warm_time_files=(
            "$LOG_DIR"/warm-open-samples/[0-9][0-9][0-9].time
          )
          if [[ "${#warm_time_files[@]}" -ne 101 ]]; then
            echo "warm-open requires 101 child-process RSS timing records"
            exit 1
          fi
          for time_file in "${warm_time_files[@]}"; do
            if [[ ! -s "$time_file" ]]; then
              echo "warm-open RSS timing record is empty: $time_file"
              exit 1
            fi
          done
