name: Release surface evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NSUnbufferedIO: YES
  OS_ACTIVITY_MODE: disable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-surface:
    name: Card 5D ad-hoc Release symbols
    runs-on: macos-26
    timeout-minutes: 25
    env:
      LOG_DIR: ${{ github.workspace }}/release-surface-logs
      DERIVED_DATA: ${{ github.workspace }}/DerivedData-ReleaseSurface
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runner contract
        shell: bash
        run: bash scripts/ci/verify_macos_runner.sh "$LOG_DIR/runner.log"

      - name: Build and inspect ordinary Release app
        shell: bash
        run: >-
          bash scripts/ci/run_release_surface.sh
          "$LOG_DIR" "$DERIVED_DATA"
          "$RUNNER_TEMP/xcodegen-2.45.4"

      - name: Upload bounded symbol evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-surface-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-surface-logs
          if-no-files-found: warn
          retention-days: 14
