name: APFS ENOSPC evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NSUnbufferedIO: YES
  OS_ACTIVITY_MODE: disable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apfs-enospc:
    name: Card 6B full-disk cells
    runs-on: macos-26
    timeout-minutes: 25
    env:
      LOG_DIR: ${{ github.workspace }}/apfs-enospc-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runner contract
        shell: bash
        run: bash scripts/ci/verify_macos_runner.sh "$LOG_DIR/runner.log"

      - name: Exercise disposable APFS ENOSPC capture
        shell: bash
        run: >-
          bash scripts/ci/run_apfs_enospc.sh
          "$LOG_DIR" "$RUNNER_TEMP"

      - name: Emit bounded phase diagnostics
        if: always()
        shell: bash
        run: |
          # This is a best-effort evidence emitter: it must never mask the
          # owning APFS step status, even after a partial bootstrap failure.
          set +e
          if [[ ! -d "$LOG_DIR" ]]; then
            printf 'CLIPY_APFS_DIAGNOSTIC log-directory=absent\n'
            exit 0
          fi
          find "$LOG_DIR" -type f | LC_ALL=C sort |
            while IFS= read -r diagnostic_path
            do
              diagnostic_name="${diagnostic_path#"$LOG_DIR"/}"
              printf '== CLIPY_APFS_DIAGNOSTIC %s ==\n' "$diagnostic_name"
              sed -n '1,240p' "$diagnostic_path"
            done
          exit 0

      - name: Upload bounded runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apfs-enospc-${{ github.run_id }}-${{ github.run_attempt }}
          path: apfs-enospc-logs
          if-no-files-found: warn
          retention-days: 14
