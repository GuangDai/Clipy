name: Signed Release runtime evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NSUnbufferedIO: YES
  OS_ACTIVITY_MODE: disable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  signed-runtime:
    name: Ad-hoc signed Release lifecycle
    runs-on: macos-26
    timeout-minutes: 25
    env:
      LOG_DIR: ${{ github.workspace }}/signed-runtime-logs
      DERIVED_DATA: ${{ github.workspace }}/DerivedData-SignedRuntime
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runner contract
        shell: bash
        run: bash scripts/ci/verify_macos_runner.sh "$LOG_DIR/runner.log"

      - name: Build, sign, verify, and launch once
        shell: bash
        run: >-
          bash scripts/ci/run_signed_runtime.sh
          "$LOG_DIR" "$DERIVED_DATA"
          "$RUNNER_TEMP/xcodegen-2.45.4"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signed-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-runtime-logs
          if-no-files-found: warn
          retention-days: 14
