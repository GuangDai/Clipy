name: macOS 26 ARM CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      ui_test_class:
        description: Optional GUI test class for focused diagnosis (empty runs full CI)
        required: false
        default: ''
        type: string
  workflow_call:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NSUnbufferedIO: YES
  OS_ACTIVITY_MODE: disable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  spm-build-test:
    name: SwiftPM build + test
    if: github.event_name != 'workflow_dispatch' || inputs.ui_test_class == ''
    runs-on: macos-26
    timeout-minutes: 30
    env:
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runner contract
        shell: bash
        run: bash scripts/ci/verify_macos_runner.sh

      - name: Run SwiftPM correctness
        shell: bash
        run: >-
          bash scripts/ci/run_spm_correctness.sh
          "$LOG_DIR" "$RUNNER_TEMP/clipy-fixtures"

      - name: Capture SwiftPM crash evidence
        if: failure()
        shell: bash
        run: |
          python3 - <<'CRASH'
          from pathlib import Path
          import os
          import shutil
          directory = Path.home() / "Library" / "Logs" / "DiagnosticReports"
          for report in sorted(directory.glob("swiftpm-testing-helper*.ips"),
                               key=lambda path: path.stat().st_mtime, reverse=True)[:2]:
              shutil.copy2(report, Path(os.environ["LOG_DIR"]) / report.name)
          CRASH

      - name: Upload SwiftPM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: warn
          retention-days: 14
