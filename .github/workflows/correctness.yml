name: macOS 26 ARM CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NSUnbufferedIO: YES
  OS_ACTIVITY_MODE: disable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  spm-build-test:
    name: SwiftPM build + test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runner contract
        shell: bash
        run: bash scripts/ci/verify_macos_runner.sh

      - name: Run SwiftPM correctness
        shell: bash
        run: >-
          bash scripts/ci/run_spm_correctness.sh
          "$LOG_DIR" "$RUNNER_TEMP/clipy-fixtures"

      - name: Upload SwiftPM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: warn
          retention-days: 14

  xcodeproj:
    name: XcodeGen generate + app build/test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
      LOG_DIR: ${{ github.workspace }}/ci-logs
      RESULT_BUNDLES: ${{ github.workspace }}/ci-result-bundles
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runner contract
        shell: bash
        run: bash scripts/ci/verify_macos_runner.sh

      - name: Run application correctness
        shell: bash
        run: >-
          bash scripts/ci/run_app_correctness.sh
          "$LOG_DIR" "$RESULT_BUNDLES" "$DERIVED_DATA"
          "$RUNNER_TEMP/clipy-fixtures"
          "$RUNNER_TEMP/xcodegen-2.45.4"

      - name: Upload application evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodeproj-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs
            ci-result-bundles
          if-no-files-found: warn
          retention-days: 14
