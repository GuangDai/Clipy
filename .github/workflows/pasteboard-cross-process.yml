name: General pasteboard cross-process evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NSUnbufferedIO: YES
  OS_ACTIVITY_MODE: disable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pasteboard-cross-process:
    name: Ad-hoc adapter writer then native reader
    runs-on: macos-26
    timeout-minutes: 25
    env:
      LOG_DIR: ${{ github.workspace }}/pasteboard-cross-process-logs
      BUILD_DIR: ${{ github.workspace }}/Build-PasteboardCrossProcess
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runner contract
        shell: bash
        run: bash scripts/ci/verify_macos_runner.sh "$LOG_DIR/runner.log"

      - name: Build, sign, and exercise General pasteboard visibility
        shell: bash
        run: >-
          bash scripts/ci/run_pasteboard_cross_process.sh
          "$LOG_DIR" "$BUILD_DIR"

      - name: Upload content-free cross-process evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pasteboard-cross-process-${{ github.run_id }}-${{ github.run_attempt }}
          path: pasteboard-cross-process-logs
          if-no-files-found: warn
          retention-days: 14
