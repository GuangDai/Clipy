name: Reusable performance helper and proof evidence

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Performance suite to run
        required: true
        default: helpers
        type: choice
        options: [helpers, proofs]
  workflow_call:
    inputs:
      suite:
        required: true
        type: string

permissions:
  contents: read

env:
  NSUnbufferedIO: YES
  OS_ACTIVITY_MODE: disable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  selected-suite:
    name: Selected performance helper/proof suite
    runs-on: macos-26
    timeout-minutes: 30
    env:
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runner contract
        shell: bash
        run: bash scripts/ci/verify_macos_runner.sh "$LOG_DIR/diagnostics.log"

      - name: Run isolated recent index experiment in Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          swift test -c release --filter 'HistoryPerfTests.RecentIndexExperimentTests' \
            2>&1 | tee "$LOG_DIR/perf-test.log"
          python3 scripts/diagnostic_scan.py --profile strict "$LOG_DIR/perf-test.log"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs
          if-no-files-found: warn
          retention-days: 30
